# ---------------------------------------------------------------------------
# EA Factory Pro - Redis configuration.
# Redis carries the agent message bus (Pub/Sub) and the hot cache, not the
# system of record, so persistence is light and eviction is allowed.
# ---------------------------------------------------------------------------

bind 0.0.0.0
protected-mode no
port 6379
tcp-keepalive 60
timeout 0

# Memory: cap the cache and drop the least recently used keys first.
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence: a light RDB snapshot is enough for a message bus.
save 900 1
save 300 10
appendonly no

# Pub/Sub clients must not be disconnected during agent bursts.
client-output-buffer-limit pubsub 64mb 32mb 120

loglevel notice
databases 4
